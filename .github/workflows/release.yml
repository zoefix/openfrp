name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The tag and the source must agree
        run: |
          declared=$(awk -F'"' '/^	Version = /{print $2}' internal/version/version.go)
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "the tag says ${{ steps.version.outputs.version }} but" \
                 "internal/version/version.go says $declared" >&2
            echo "a release whose binary reports a different number than its" \
                 "tag will offer itself as an upgrade forever" >&2
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1 -timeout 600s

      - name: Build the bundles
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/bundle.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
