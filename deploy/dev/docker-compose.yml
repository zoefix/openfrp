# Local end-to-end stack.
#
#   make dev-up
#   curl -s http://localhost:6080/    # reaches nginx through the tunnel
#
# The three containers mirror the real topology: `service` is the LAN service,
# `openfrpc` is the router, and `openfrps` is the public host. Only the server
# publishes ports to the host, exactly as in production.

name: openfrp-dev

services:
  service:
    image: nginx:alpine
    container_name: openfrp-dev-service
    networks: [lan]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 2s
      timeout: 2s
      retries: 15

  openfrps:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile
    container_name: openfrp-dev-server
    command: ["/openfrps", "-c", "/etc/openfrp/openfrps.json"]
    volumes:
      - ./openfrps.json:/etc/openfrp/openfrps.json:ro
    networks: [lan]
    ports:
      # 7000 is the control port; 6080 is the tunnel this stack publishes.
      - "127.0.0.1:7000:7000"
      - "127.0.0.1:6080:6080"

  openfrpc:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile
    container_name: openfrp-dev-client
    command: ["/openfrpc", "run", "-c", "/etc/openfrp/openfrpc.json"]
    volumes:
      - ./openfrpc.json:/etc/openfrp/openfrpc.json:ro
    networks: [lan]
    depends_on:
      openfrps:
        condition: service_started
      service:
        condition: service_healthy
    restart: unless-stopped

networks:
  lan:
    driver: bridge
