serverAddr = "frps"
serverPort = 7000

auth.method = "token"
auth.token = "bench-token"

# frpc exits on a failed first login by default, which makes a cold start race
# the server coming up. Robustness only — not a tuning knob.
#
# NOTE: this must stay above [[proxies]]. TOML assigns any bare key after a
# table header to that table, so placing it below would silently make it a
# proxy field and frpc would refuse the whole config.
loginFailExit = false

log.level = "warn"

# Everything else is left at frp's defaults on purpose. transport.tcpMux
# defaults to true and transport.poolCount to 5; those defaults are precisely
# what the comparison is about, so overriding them would measure a
# configuration nobody actually runs.

[[proxies]]
name = "echo"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9000
remotePort = 6000
