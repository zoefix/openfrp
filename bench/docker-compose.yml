# Side-by-side benchmark: OpenFrp and frp under identical conditions.
#
# Topology, mirrored exactly for both stacks:
#
#   loadgen ──fast──> server ──shaped WAN──> client ──loopback──> echo
#
# Two details make the numbers trustworthy:
#
#   1. netem is applied to the CLIENT's eth0 only. That is the WAN link a
#      router actually sits behind. Shaping the server instead would also
#      delay the load generator's own traffic and double-count the latency.
#
#   2. Each echo backend shares its client's network namespace, so the client
#      reaches it over loopback. netem is per-device and does not touch lo, so
#      the LAN hop stays unshaped and the measurement isolates the tunnel.
#
# Both stacks run the same base image, the same kernel and the same shaping.
# frp is left at its defaults, including tcpMux, because that is what a user
# gets and what the comparison is about.

name: openfrp-bench

x-shaping: &shaping
  NETEM_DELAY: "${NETEM_DELAY:-}"
  NETEM_LOSS: "${NETEM_LOSS:-}"

services:
  # ---------------------------------------------------------------- OpenFrp
  openfrps:
    build:
      context: ..
      dockerfile: bench/Dockerfile.openfrp
    command: ["openfrps", "-c", "/etc/openfrp/openfrps.json"]
    volumes:
      - ./config/openfrps.json:/etc/openfrp/openfrps.json:ro
    networks: [wan]

  openfrpc:
    build:
      context: ..
      dockerfile: bench/Dockerfile.openfrp
    entrypoint: ["/usr/local/bin/shape.sh"]
    command: ["openfrpc", "run", "-c", "/etc/openfrp/openfrpc.json"]
    environment:
      <<: *shaping
      ECHO_ADDR: "127.0.0.1:9000"
    volumes:
      - ./config/openfrpc.json:/etc/openfrp/openfrpc.json:ro
    networks: [wan]
    cap_add: [NET_ADMIN]
    depends_on: [openfrps]
    restart: unless-stopped


  # -------------------------------------------------------------------- frp
  frps:
    build:
      context: ..
      dockerfile: bench/Dockerfile.frp
    command: ["frps", "-c", "/etc/frp/frps.toml"]
    volumes:
      - ./config/frps.toml:/etc/frp/frps.toml:ro
    networks: [wan]

  frpc:
    build:
      context: ..
      dockerfile: bench/Dockerfile.frp
    entrypoint: ["/usr/local/bin/shape.sh"]
    command: ["frpc", "-c", "/etc/frp/frpc.toml"]
    environment:
      <<: *shaping
      ECHO_ADDR: "127.0.0.1:9000"
    volumes:
      - ./config/frpc.toml:/etc/frp/frpc.toml:ro
    networks: [wan]
    cap_add: [NET_ADMIN]
    depends_on: [frps]
    restart: unless-stopped


  # ---------------------------------------------------------------- driver
  loadgen:
    build:
      context: ..
      dockerfile: bench/Dockerfile.openfrp
    entrypoint: ["loadgen"]
    networks: [wan]
    profiles: ["driver"]
    depends_on: [openfrps, frps]

networks:
  wan:
    driver: bridge
