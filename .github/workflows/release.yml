name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the notes are read out of the annotated tag,
      # which a shallow fetch does not reliably bring with it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "\"$version\" is not an x.y.z version" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Every copy of the version must agree
        env:
          WANT: ${{ steps.version.outputs.version }}
        run: |
          fail=0
          check() {
            if [ "$2" != "$WANT" ]; then
              echo "::error file=$1::says $2, the tag says $WANT"
              fail=1
            fi
          }

          check internal/version/version.go \
            "$(awk -F'"' '/^\tVersion = /{print $2}' internal/version/version.go)"
          check openwrt/net/openfrp/Makefile \
            "$(awk -F':=' '/^PKG_VERSION/{print $2}' openwrt/net/openfrp/Makefile)"
          check openwrt/luci/luci-app-openfrp/Makefile \
            "$(awk -F':=' '/^PKG_VERSION/{print $2}' openwrt/luci/luci-app-openfrp/Makefile)"

          if [ "$fail" = 1 ]; then
            echo "A release whose binary reports a number other than its tag" \
                 "offers itself as an upgrade forever. Bump every copy." >&2
            exit 1
          fi

      - name: Vet and format
        run: |
          go vet ./...
          unformatted=$(gofmt -l cmd internal pkg tools)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed: $unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -count=1 -timeout 900s

      - name: Cross-compile every target
        run: make cross

      - name: Build the bundles
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/bundle.sh

      - name: The bundles must be what the installer expects
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            bundle="dist/openfrp-$VERSION-linux-$arch.tar.gz"
            [ -f "$bundle" ] || { echo "::error::missing $bundle"; exit 1; }

            for path in usr/bin/openfrpc usr/lib/openfrp/openfrps \
              usr/libexec/openfrp/render usr/libexec/openfrp/job \
              usr/share/rpcd/ucode/openfrp.uc \
              www/luci-static/resources/view/openfrp/status.js \
              usr/lib/lua/luci/i18n/openfrp.zh-cn.lmo; do
              tar -tzf "$bundle" | sed 's|^\./||' | grep -qx "$path" ||
                { echo "::error::$bundle has no $path"; exit 1; }
            done

            grep -q " openfrp-$VERSION-linux-$arch.tar.gz" dist/checksums.txt ||
              { echo "::error::checksums.txt does not list $arch"; exit 1; }
          done
          echo "Bundles and checksums verified"

      # The annotated tag is the release notes. Left to itself GitHub writes a
      # link to a commit range, which is the changelog equivalent of shrugging.
      - name: Take the notes from the tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Fetched explicitly and checked: how the checkout happens to
            # materialise a tag decides whether %(contents) is the tag's
            # message or the commit's, and the wrong one looks like notes
            # right up until you read them.
            git fetch --force origin \
              "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

            kind="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || echo none)"
            if [ "$kind" != "tag" ]; then
              echo "::error::${GITHUB_REF_NAME} is a $kind, not an annotated tag."
              echo "::error::Tag with: git tag -a --cleanup=verbatim ${GITHUB_REF_NAME} -F notes"
              exit 1
            fi

            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "::error::${GITHUB_REF_NAME:-this build} has no annotated tag message."
            echo "::error::Tag with: git tag -a --cleanup=verbatim vX.Y.Z -F notes"
            exit 1
          fi
          # git strips lines beginning with # from a tag message unless told
          # not to, which silently eats every markdown heading. Worth saying
          # so, since the notes still look fine until you read them on the
          # release page.
          if grep -q '^\s*-\|^###' notes.md; then
            :
          else
            echo "::warning::notes have no headings or bullets — if you wrote" \
                 "markdown headings, tag with --cleanup=verbatim; git treats" \
                 "# lines as comments and removes them"
          fi
          cat notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          body_path: notes.md
          fail_on_unmatched_files: true
